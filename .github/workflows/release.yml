name: Release

# Publishes @ttthree/tokmon to npm when package.json's `version` field
# changes on `main` (i.e. a PR that bumped the version was merged).
#
# Idempotent: if the version on main equals the latest git tag, the
# publish step is skipped — so re-runs and unrelated pushes are no-ops.

on:
  push:
    branches:
      - main

permissions:
  contents: write     # needed to create/push tags + GitHub Releases
  id-token: write     # needed for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags + history for the version-changed check

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Read package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"   >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "refs/tags/${{ steps.pkg.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.pkg.outputs.tag }} already exists — skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${{ steps.pkg.outputs.tag }} does not exist — will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.check.outputs.should_publish == 'true'
        run: npm ci

      - name: Build
        if: steps.check.outputs.should_publish == 'true'
        run: npm run build

      - name: Test
        if: steps.check.outputs.should_publish == 'true'
        run: npm run test:unit

      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create git tag
        if: steps.check.outputs.should_publish == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.pkg.outputs.tag }}" -m "Release ${{ steps.pkg.outputs.tag }}"
          git push origin "${{ steps.pkg.outputs.tag }}"

      - name: Extract changelog section
        if: steps.check.outputs.should_publish == 'true'
        id: changelog
        run: |
          # Pull the section between "## [<version>]" and the next "## ["
          # so the GitHub Release body matches CHANGELOG.md exactly.
          VERSION="${{ steps.pkg.outputs.version }}"
          BODY=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/        { exit }
            capture                    { print }
          ' CHANGELOG.md)
          {
            echo 'body<<CHANGELOG_EOF'
            echo "$BODY"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.check.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: ${{ steps.pkg.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
